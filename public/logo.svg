<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Background Plate with Linear Dark Surface & Border -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#151922" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  
  <!-- Subtle Ambient Glow -->
  <radialGradient id="ambient-glow" cx="50%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0E1117" stop-opacity="0"/>
  </radialGradient>
  <rect x="5" y="5" width="110" height="110" rx="27" fill="url(#ambient-glow)"/>

  <!-- Dynamic Y-Nexus Geometric Glyph -->
  <defs>
    <linearGradient id="yoshlar-grad" x1="24" y1="24" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Glowing subtle backdrop behind glyph -->
  <path d="M28 28L60 62L92 28M60 62V94" stroke="#6366F1" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#glow)"/>

  <!-- Clean Strict Geometric Vector Stroke -->
  <path d="M28 28L60 62L92 28M60 62V94" stroke="url(#yoshlar-grad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
